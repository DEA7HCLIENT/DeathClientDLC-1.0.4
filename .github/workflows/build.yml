name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Unpack and build
        run: |
          unzip -q "$(ls *.zip | head -1)" -d work
          D="$(dirname "$(find work -name build.gradle | head -1)")"
          cd "$D"
          gradle build --no-daemon
          echo "JAR_DIR=$D/build/libs" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC-jar
          path: work/**/build/libs/*.jar
