name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Unpack
        run: unzip -q DeathClientDLC_glow.zip
      - name: Build
        working-directory: DeathClientDLC
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC
          path: DeathClientDLC/build/libs/*.jar
