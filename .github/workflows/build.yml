name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Unpack
        run: |
          ls -la
          zip_file="$(ls *glow*.zip | head -1)"
          echo "Using: $zip_file"
          unzip -oq "$zip_file"
          ls DeathClientDLC
      - name: Build
        working-directory: DeathClientDLC
        run: |
          set +e
          gradle build --console=plain 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          { echo '### Errors'; echo '```'; grep -E "error:" -A1 ../build.log | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - 

 
